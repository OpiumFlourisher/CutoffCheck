name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the app page from web/template.html
        run: |
          python -m pip install --quiet numpy
          python web/build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CUTOFFCHECK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key, so it can't be installed as an update over another build."
          fi

      - name: Build the APK
        env:
          CUTOFFCHECK_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CUTOFFCHECK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CUTOFFCHECK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "CutoffCheck-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CutoffCheck-${{ steps.version.outputs.name }}
          path: CutoffCheck-*.apk

      - name: Attach the APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CutoffCheck-*.apk
          generate_release_notes: true
